# Pinned so every checkout (main + any .worktrees/<branch>/ copy of this
# file) shares one Compose project identity. Without this, the project name
# defaults to the current directory's basename, so `make stop`/`make clean`
# run from a different worktree than the one that started the stack sees no
# running containers at all (Compose matches by project label, not just
# container_name) - and running `make install` from a second worktree hits a
# "container name already in use" conflict against the first's containers
# instead of managing them.
name: woocommerce-plugin-dev

services:
  wordpress:
    container_name: wordpress
    extra_hosts:
      - "portal.localhost:host-gateway"
    image: wordpress:6.8-php8.2-apache
    restart: always
    ports:
      - 8888:80
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: twocommerce
      WORDPRESS_DB_PASSWORD: twocommerce
      WORDPRESS_DB_NAME: twocommerce
      WORDPRESS_DEBUG: "true"
      # Site URLs follow the request host, so the shop serves correctly on both
      # http://localhost:8888 and the FRP tunnel host. Unset on a direct
      # localhost request, so WP falls back to the DB siteurl.
      #
      # Must run in wp-config, NOT a mu-plugin: wp-settings.php bakes
      # WP_CONTENT_URL (and WP_PLUGIN_URL from it) out of get_option('siteurl')
      # before mu-plugins load, so an option_siteurl filter can never reach an
      # asset URL, while the WP_SITEURL constant can.
      #
      # Keyed on X-Forwarded-Host because FRP terminates TLS at the edge but
      # forwards X-Forwarded-Proto: http, so the scheme is forced, not trusted.
      WORDPRESS_CONFIG_EXTRA: |
        if ( ! empty( $$_SERVER['HTTP_X_FORWARDED_HOST'] ) ) {
            $$_SERVER['HTTPS']       = 'on';
            $$_SERVER['SERVER_PORT'] = 443;
            $$two_fwd_host = trim( explode( ',', $$_SERVER['HTTP_X_FORWARDED_HOST'] )[0] );
            define( 'WP_HOME', 'https://' . $$two_fwd_host );
            define( 'WP_SITEURL', WP_HOME );
        }
      # Brand override for the plugin's WC_Twoinc_Brand loader (dev only)
      TWO_BRAND_CODE: "${TWO_BRAND_CODE:-}"
      # Dev-only API host override (TWO-25386) — read by
      # WC_Twoinc_Helper::get_effective_environment_mode() /
      # WC_Twoinc::get_twoinc_checkout_host() on a dev-sniffed shop. Not a
      # wp-admin field (the merchant-facing test-host control was removed);
      # this must be an actual PHP-visible env var on the container that
      # serves checkout requests, not a WP option, so it lives here rather
      # than only on the wpcli container.
      TWOINC_DEV_API_HOST: "${TWO_API_BASE_URL:-}"
      # Sibling overrides for the other two service hosts (TWO-40 §9), each
      # independent and each falling back on its own when unset.
      #
      # TWO_CHECKOUT_BASE_URL is the one the BROWSER loads — the hosted
      # checkout-page app behind sole-trader signup and company search — so it
      # has to be a host the buyer's browser can resolve. `localhost` and
      # `host.docker.internal` are fine while the shop itself is local and
      # resolve to nothing useful once it is not; a reverse tunnel exposing the
      # local checkout-page dev server is what covers the remote-shop case.
      TWOINC_DEV_CHECKOUT_HOST: "${TWO_CHECKOUT_BASE_URL:-}"
      TWOINC_DEV_PORTAL_HOST: "${TWO_PORTAL_BASE_URL:-}"
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/tillit-payment-gateway
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins
      - apache_log:/var/log/apache2/
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  wpcli:
    container_name: wpcli
    image: wordpress:cli-2.11.0-php8.2
    user: "33:33"
    entrypoint: /opt/tillit-payment-gateway/docker/wpcli.sh
    restart: always
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: twocommerce
      WORDPRESS_DB_PASSWORD: twocommerce
      WORDPRESS_DB_NAME: twocommerce
      WORDPRESS_URL: "http://localhost:8888"
      WORDPRESS_TITLE: "Twocommerce Wordpress"
      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: twoinb2b
      WORDPRESS_ADMIN_EMAIL: admin@two.inc
      WOOCOM_PLUGIN_CONFIG_JSON: "${WOOCOM_PLUGIN_CONFIG_JSON:-docker/config/local.json}"
      WOOCOM_CURRENCY: "${WOOCOM_CURRENCY:-GBP}"
      WOOCOM_DEFAULT_COUNTRY: "${WOOCOM_DEFAULT_COUNTRY:-GB}"
      WOOCOM_VERSION: "${WOOCOM_VERSION:-9.9.5}"
      TWO_BRAND_CODE: "${TWO_BRAND_CODE:-}"
      TWO_API_KEY: "${TWO_API_KEY:-}"
      TWO_API_BASE_URL: "${TWO_API_BASE_URL:-}"
    volumes:
      - wordpress_data:/var/www/html
      - .:/opt/tillit-payment-gateway
      - .:/var/www/html/wp-content/plugins/tillit-payment-gateway
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_healthy

  mariadb:
    container_name: mariadb
    image: mariadb:10.2
    restart: always
    environment:
      MYSQL_DATABASE: twocommerce
      MYSQL_USER: twocommerce
      MYSQL_PASSWORD: twocommerce
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "twocommerce", "-ptwocommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordpress_data:
  mariadb_data:
  apache_log:
