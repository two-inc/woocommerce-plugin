name: Merge back

on:
  push:
    branches: [main]
  # Dispatchable so this can be exercised without waiting for a release.
  workflow_dispatch:

concurrency:
  group: merge-main
  cancel-in-progress: true

jobs:
  main-to-staging:
    name: main → staging
    runs-on: ${{ vars.RUNNER_STANDARD }}
    if: github.ref_name == 'main'
    steps:
      # actions-public, not the private two-inc/actions the private plugin
      # repos use: this repository is public and GitHub will not resolve an
      # action in a private repo from one.
      - name: Merge or create pull request
        uses: two-inc/actions-public/back-merge@main
        with:
          client-id: ${{ vars.TWO_INC_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.TWO_INC_APP_PRIVATE_KEY }}
          source-ref: main
          target-ref: staging
          reviewer: brtkwr
