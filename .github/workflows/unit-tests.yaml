name: Unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: unit-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The PHP axis of the support matrix (TWO-25016): the plugin's
        # declared floor (7.4 — the oldest syntax the code targets) through
        # every currently-supported PHP minor. The suite is dependency-free
        # and runs in seconds, so full-span legs are effectively free; the
        # WooCommerce axis lives in support-matrix.yaml.
        php-version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Run unit tests
        run: php tests/unit/run.php

  jest:
    name: Jest (Node 20)
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS devDependencies
        run: npm ci --no-audit --no-fund

      # Real gate, deliberately not continue-on-error: the company-search
      # regressions these tests pin (a timeout rendering as "no companies
      # found", a superseded response overwriting a newer one, a throw inside
      # processResults leaving the dropdown stuck on "Searching…") were all
      # invisible to the PHP suite, so an advisory JS job would have caught
      # none of them.
      - name: Run Jest
        run: npm run test:js
