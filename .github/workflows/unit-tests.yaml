name: Unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: unit-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # The PHP minors to test, read from php.net on every run by
  # dev/support-matrix.sh (TWO-27171): every minor from the plugin's declared
  # floor (readme.txt "Requires PHP") to the newest one php.net supports. A
  # transport or parse failure fails discovery rather than skipping green.
  discover:
    name: Discover PHP versions
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      php: ${{ steps.gen.outputs.php }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the PHP minors
        id: gen
        run: |
          set -o pipefail
          php=$(bash dev/support-matrix.sh --emit-all | jq -c '.php_unit')
          echo "PHP minors: $php"
          echo "php=$php" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php-version }})
    needs: discover
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The suite is dependency-free and runs in seconds, so every minor is a
        # leg. A minor-only pin: setup-php resolves the newest patch.
        php-version: ${{ fromJSON(needs.discover.outputs.php) }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # Every PHP file merchants receive parses on this minor, including the
      # ones the unit suite never loads. The file list is the package itself
      # (git archive honours .gitattributes export-ignore), so it cannot drift.
      - name: Lint the shipped PHP files
        run: |
          set -o pipefail
          files=$(git archive --format tar --worktree-attributes HEAD | tar -t | grep '\.php$')
          echo "Linting $(wc -l <<<"$files") files on PHP $(php -r 'echo PHP_VERSION;')"
          tr '\n' '\0' <<<"$files" | xargs -0 -n 1 php -d display_errors=1 -l | { grep -v '^No syntax errors detected' || true; }

      - name: Run unit tests
        run: php tests/unit/run.php

  jest:
    name: Jest (Node 20)
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS devDependencies
        run: npm ci --no-audit --no-fund

      # Real gate, deliberately not continue-on-error: the company-search
      # regressions these tests pin (a timeout rendering as "no companies
      # found", a superseded response overwriting a newer one, a throw inside
      # processResults leaving the dropdown stuck on "Searching…") were all
      # invisible to the PHP suite, so an advisory JS job would have caught
      # none of them.
      - name: Run Jest
        run: npm run test:js
