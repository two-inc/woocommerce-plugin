name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Which WordPress x WooCommerce x PHP combinations the checkout suite runs
  # on (TWO-27171), read from upstream on every run by dev/support-matrix.sh,
  # whose header states the support policy and sources. Each runnable
  # combination runs the classic and the blocks checkout (TWO-25797).
  #
  # Honest CI (TWO-24998): the run or skip decision is made here. A combination
  # that cannot run never becomes a green leg: it is listed in this job's step
  # summary and gets one ::warning:: with its reason. A transport or parse
  # failure fails discovery rather than emitting an empty matrix.
  discover:
    name: Discover the support matrix
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    outputs:
      combos: ${{ steps.gen.outputs.combos }}
    steps:
      - uses: actions/checkout@v7

      - name: Classify every combination in the support window
        id: gen
        run: |
          set -o pipefail
          all=$(bash dev/support-matrix.sh --emit-all)
          combos=$(jq -c '.e2e' <<<"$all")
          skips=$(jq -c '.skips' <<<"$all")
          echo "combos=$combos" >> "$GITHUB_OUTPUT"
          echo "Runnable combinations:"
          jq . <<<"$combos"
          {
            echo "## WordPress x WooCommerce x PHP coverage"
            echo ""
            echo "Each tested combination runs the classic and the blocks checkout."
            echo ""
            echo "| WordPress | WooCommerce | PHP | Status | Reason |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| \(.wordpress) | \(.woocommerce) | \(.php) | ✅ tested | |"' <<<"$combos"
            jq -r '.[] | "| \(.wordpress) | \(.woocommerce) | \(.php) | 🚫 NOT run | \(.reason) |"' <<<"$skips"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "::warning title=Combination NOT tested::WordPress \(.wordpress) / WooCommerce \(.woocommerce) / PHP \(.php): \(.reason)"' <<<"$skips"
          if [ "$(jq length <<<"$combos")" -eq 0 ]; then
            echo "::error::e2e: no runnable combination in the support window"
            exit 1
          fi

  e2e-tests:
    name: e2e (WP ${{ matrix.combo.wordpress }}, WC ${{ matrix.combo.woocommerce }}, PHP ${{ matrix.combo.php }}, ${{ matrix.renderer }})
    needs: discover
    runs-on: ${{ vars.RUNNER_STANDARD }}
    strategy:
      fail-fast: false
      # Every runnable combination times both renderers. Capped so the legs do
      # not all place orders on Two staging at once; the cap costs wall time,
      # never coverage.
      max-parallel: 12
      matrix:
        combo: ${{ fromJSON(needs.discover.outputs.combos) }}
        renderer: [classic, blocks]
    # Namespace the Compose project per leg, the same way upgrade-smoke.yaml
    # namespaces its docker resources by run id. The
    # compose volumes are project-scoped, so a leg landing on a runner that
    # still holds another job's `wordpress_data` would otherwise boot on that
    # install rather than on the WordPress it asked for. This is needed whether
    # or not the legs run in parallel: they need not share a runner, so the
    # teardown below can run somewhere other than where the next leg starts.
    env:
      COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-${{ strategy.job-index }}
    # Must exceed Playwright's own worst case, or a fully-failing suite is
    # killed before it can report: 8 tests x 2 attempts (retries: 1) x the
    # 180s per-test timeout = 48m, plus 5 order-intent legs x 2 x 120s = 20m,
    # of testing, plus ~5m of setup. At 15m the job was cancelled mid-run,
    # which discards the reporter output AND the traces, leaving no way to see
    # why a test failed. A passing run still takes ~9m, so this ceiling only
    # ever costs time on a broken suite.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7

      # One host port per leg: a port binding is not project-scoped the way the
      # Compose project name above is, so parallel legs would otherwise collide
      # on it. Compose publishes this and the e2e suite reads it, so the whole
      # stack follows from the one variable. Shell arithmetic because `+` is
      # not a GitHub expression operator.
      - name: Allocate a host port for this leg
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: echo "WORDPRESS_PORT=$((8888 + JOB_INDEX))" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          # Own no-roles SA (infra PLAT-2550/ISEC-350): this repo is public, so it
          # must not share gha-e2e-tests, which reads every staging/release shop key.
          service_account: gha-woocommerce-plugin-e2e@two-beta.iam.gserviceaccount.com
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER_PREFIX_TWO_BETA }}/${{ github.event.repository.name }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Fetch secrets
        id: secrets
        run: |
          # Temporary: the usual e2e test account has too much order history to
          # place orders reliably; revert to it once that is cleared.
          MERCHANT_API_KEY=$(gcloud secrets versions access latest --secret="STAGING_SHOP_MERCHANT_API_KEY_GB" --project=two-beta)
          echo "::add-mask::$MERCHANT_API_KEY"
          echo "MERCHANT_API_KEY=$MERCHANT_API_KEY" >> $GITHUB_OUTPUT

          TWO_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret="STAGING_TWO_ADMIN_PASSWORD" --project=two-beta)
          echo "::add-mask::$TWO_ADMIN_PASSWORD"
          echo "TWO_ADMIN_PASSWORD=$TWO_ADMIN_PASSWORD" >> $GITHUB_OUTPUT

      - name: Generate Docker plugin config
        run: |
          mkdir -p docker/config
          sed "s|\${MERCHANT_API_KEY}|${MERCHANT_API_KEY}|g" docker/config/staging-demostoregb.json.tpl > docker/config/staging-demostoregb.json
        env:
          MERCHANT_API_KEY: ${{ steps.secrets.outputs.MERCHANT_API_KEY }}

      # The maintained wordpress:php<minor>-apache runtime with this leg's
      # WordPress core swapped in; see the Dockerfile for why not the series tag.
      - name: Build the WordPress ${{ matrix.combo.wordpress }} on PHP ${{ matrix.combo.php }} image
        run: |
          docker build --pull \
            --build-arg PHP_MINOR=${{ matrix.combo.php }} \
            --build-arg WORDPRESS_CORE=${{ matrix.combo.wordpress }} \
            -t "$COMPOSE_PROJECT_NAME-wordpress" docker/wordpress-core

      - name: Start WordPress
        run: |
          # Compose defaults WOOCOM_PLUGIN_CONFIG_JSON to the local-dev
          # config; CI must seed the gateway with the staging config the
          # previous step rendered. WORDPRESS_IMAGE and WOOCOM_VERSION select
          # this leg's combination.
          {
            echo "WOOCOM_PLUGIN_CONFIG_JSON=docker/config/staging-demostoregb.json"
            # The seeded config stores staging; the flag is what offers
            # Staging in the admin (TWO-26604).
            echo "TWO_INTERNAL_ENVIRONMENTS=1"
            echo "WORDPRESS_IMAGE=$COMPOSE_PROJECT_NAME-wordpress"
            echo "WOOCOM_VERSION=${{ matrix.combo.woocommerce }}"
          } > .env
          docker compose up -d

      - name: Wait for bootstrap to complete
        run: |
          for i in $(seq 1 60); do
            if docker compose logs wpcli 2>&1 | grep -q "sleep infinity"; then
              echo "Bootstrap complete"
              break
            fi
            echo "Waiting for wpcli bootstrap... ($i/60)"
            sleep 5
          done
          docker compose logs wpcli 2>&1 | grep -q "sleep infinity" || (echo "Bootstrap failed" && docker compose logs && exit 1)

      # A leg that booted something other than its combination would green
      # having tested a version nobody asked for.
      - name: Record the versions under test
        env:
          WANT_WP: ${{ matrix.combo.wordpress }}
          WANT_WC: ${{ matrix.combo.woocommerce }}
          WANT_PHP: ${{ matrix.combo.php }}
        run: |
          set -o pipefail
          wp=$(docker compose exec -T wpcli wp core version | tr -d '\r')
          wc=$(docker compose exec -T wpcli wp plugin get woocommerce --field=version | tr -d '\r')
          php=$(docker compose exec -T wordpress php -r 'echo PHP_VERSION;' | tr -d '\r')
          echo "Under test: WordPress $wp, WooCommerce $wc, PHP $php"
          fail=0
          [ "$wp" = "$WANT_WP" ] || { echo "::error::e2e: expected WordPress $WANT_WP, booted $wp"; fail=1; }
          [ "$wc" = "$WANT_WC" ] || { echo "::error::e2e: expected WooCommerce $WANT_WC, installed $wc"; fail=1; }
          case "$php" in
            "$WANT_PHP".*) ;;
            *) echo "::error::e2e: expected PHP $WANT_PHP, the image runs $php"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ]
          echo "php=$php" >> "$GITHUB_OUTPUT"
        id: versions

      # The image must run the newest patch of its PHP minor, with a 7-day
      # grace for image rebuilds after a PHP release (TWO-27171).
      - name: PHP is the latest patch
        run: bash dev/check-php-patch.sh "${{ steps.versions.outputs.php }}"

      # The plugin ships a verbatim copy of core's checkout/payment-method.php,
      # replaced through woocommerce_locate_template, an override WooCommerce's
      # own "outdated templates" report cannot see because it scans the active
      # theme only. Every leg has a real WooCommerce release on disk, so diff
      # the copy against it, and run the unit suite on the leg's PHP while at it.
      # env -i: the container carries the shop's settings (TWO_* hosts, internal
      # environments), which the unit suite must not see, as on a bare runner.
      - name: Core template drift (WooCommerce ${{ matrix.combo.woocommerce }})
        run: |
          docker compose exec -T \
            -w /var/www/html/wp-content/plugins/tillit-payment-gateway \
            wordpress env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            WC_CORE_TEMPLATE_PATH=/var/www/html/wp-content/plugins/woocommerce/templates/checkout/payment-method.php \
            php tests/unit/run.php

      - name: Configure the shop for the ${{ matrix.renderer }} checkout
        run: |
          docker compose exec -T wpcli wp eval-file \
            /opt/tillit-payment-gateway/tests/e2e/provision/checkout-renderer.php \
            ${{ matrix.renderer }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: tests/e2e
        # This repo is public: Playwright's failed-request call logs can print
        # session cookies and auth headers, so redact them from the job log.
        # pipefail keeps a failing run failing the step.
        run: |
          set -o pipefail
          npx playwright test 2>&1 | sed -uE "s/((set-)?cookie|authorization)[\"']?[[:space:]]*([:=,]).*/\\1\\3 [redacted]/I"
        env:
          MERCHANT_API_KEY: ${{ steps.secrets.outputs.MERCHANT_API_KEY }}
          TWO_ADMIN_PASSWORD: ${{ steps.secrets.outputs.TWO_ADMIN_PASSWORD }}
          E2E_CHECKOUT_RENDERER: ${{ matrix.renderer }}

      - name: Upload test results
        # always(), not failure(): a job that exceeds timeout-minutes is
        # CANCELLED, not failed, and a cancelled job skips every step whose
        # condition doesn't explicitly reference always()/cancelled() — so
        # failure() silently threw away the results for exactly the runs that
        # needed them most.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per leg: upload-artifact rejects a name already used in the run,
          # so a shared name would fail the second leg on the upload rather
          # than on anything it tested.
          name: playwright-report-wp${{ matrix.combo.wordpress }}-wc${{ matrix.combo.woocommerce }}-php${{ matrix.combo.php }}-${{ matrix.renderer }}
          # Screenshots only: this repo is public and traces, videos and
          # error-context.md can carry cookies and headers.
          path: tests/e2e/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop WordPress
        if: always()
        # -v, not a bare `down`: named volumes survive a bare `down`, so with a
        # per-leg project name they would accumulate on the runner one set per
        # leg, and on a shared runner a bare `down` is what leaves a populated
        # `wordpress_data` behind for some later job to boot on. The leg's
        # image goes too, so legs do not pile images up on a shared runner.
        run: |
          docker compose down -v
          docker image rm -f "$COMPOSE_PROJECT_NAME-wordpress"
