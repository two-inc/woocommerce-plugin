name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Which WordPress x WooCommerce x PHP combinations the checkout suite runs
  # on (TWO-27171), read from upstream on every run by dev/support-matrix.sh,
  # whose header states the support policy and sources. Each runnable
  # combination runs the classic and the blocks checkout (TWO-25797).
  #
  # Honest CI (TWO-24998): the run or skip decision is made here. A combination
  # that cannot run never becomes a green leg: it is listed in this job's step
  # summary and gets one ::warning:: with its reason. A transport or parse
  # failure fails discovery rather than emitting an empty matrix. A PHP minor
  # gets legs from its first GA release; where the WordPress series does not
  # declare that PHP, the leg runs non-blocking with a warning and a summary row.
  discover:
    name: Discover the support matrix
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    outputs:
      combos: ${{ steps.gen.outputs.combos }}
    steps:
      - uses: actions/checkout@v7

      - name: Classify every combination in the support window
        id: gen
        run: |
          set -o pipefail
          all=$(bash dev/support-matrix.sh --emit-all)
          combos=$(jq -c '.e2e' <<<"$all")
          skips=$(jq -c '.skips' <<<"$all")
          echo "combos=$combos" >> "$GITHUB_OUTPUT"
          echo "Runnable combinations:"
          jq . <<<"$combos"
          {
            echo "## WordPress x WooCommerce x PHP coverage"
            echo ""
            echo "Each tested combination runs the classic and the blocks checkout."
            echo ""
            echo "| WordPress | WooCommerce | PHP | Status | Reason |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | select(.provisional | not) | "| \(.wordpress) | \(.woocommerce) | \(.php) | ✅ tested | |"' <<<"$combos"
            jq -r '.[] | select(.provisional) | "| \(.wordpress) | \(.woocommerce) | \(.php) | ⚠️ tested, non-blocking | \(.provisional_reason) |"' <<<"$combos"
            jq -r '.[] | "| \(.wordpress) | \(.woocommerce) | \(.php) | 🚫 NOT run | \(.reason) |"' <<<"$skips"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | select(.provisional) | "::warning title=Combination tested non-blocking::WordPress \(.wordpress) / WooCommerce \(.woocommerce) / PHP \(.php): \(.provisional_reason)"' <<<"$combos"
          jq -r '.[] | "::warning title=Combination NOT tested::WordPress \(.wordpress) / WooCommerce \(.woocommerce) / PHP \(.php): \(.reason)"' <<<"$skips"
          if [ "$(jq length <<<"$combos")" -eq 0 ]; then
            echo "::error::e2e: no runnable combination in the support window"
            exit 1
          fi

  e2e-tests:
    name: e2e (WP ${{ matrix.combo.wordpress }}, WC ${{ matrix.combo.woocommerce }}, PHP ${{ matrix.combo.php }}, ${{ matrix.renderer }})
    needs: discover
    runs-on: ${{ vars.RUNNER_STANDARD }}
    # A PHP minor the WordPress series does not declare is exercised but
    # cannot block (see dev/support-matrix.sh).
    continue-on-error: ${{ matrix.combo.provisional }}
    strategy:
      fail-fast: false
      # Every runnable combination times both renderers. Capped so the legs do
      # not all place orders on Two staging at once; the cap costs wall time,
      # never coverage.
      max-parallel: 12
      matrix:
        combo: ${{ fromJSON(needs.discover.outputs.combos) }}
        renderer: [classic, blocks]
    # Namespace the Compose project per leg, the same way upgrade-smoke.yaml
    # namespaces its docker resources by run id. The
    # compose volumes are project-scoped, so a leg landing on a runner that
    # still holds another job's `wordpress_data` would otherwise boot on that
    # install rather than on the WordPress it asked for. This is needed whether
    # or not the legs run in parallel: they need not share a runner, so the
    # teardown below can run somewhere other than where the next leg starts.
    env:
      COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-${{ strategy.job-index }}
      # This repo is public, so every step that prints shop or browser output
      # runs it through this one sed -E script (TWO-27183). Playwright's
      # failed-request call logs can print session cookies and auth headers.
      # Checkout URLs carry a token= value in the query or fragment, plain,
      # URL-encoded or double-encoded, so that value is redacted wherever it
      # appears.
      REDACT_SED: |-
        s/((set-)?cookie|authorization|x-api-key)["']?[[:space:]]*([:=,]).*/\1\3 [redacted]/I
        s/(token(=|%3D|%253D))[^&#[:space:]"'<>]*/\1[redacted]/Ig
    # Must exceed Playwright's own worst case, or a fully-failing suite is
    # killed before it can report: 8 tests x 2 attempts (retries: 1) x the
    # 180s per-test timeout = 48m, plus 5 order-intent legs x 2 x 120s = 20m,
    # of testing, plus ~5m of setup. At 15m the job was cancelled mid-run,
    # which discards the reporter output AND the traces, leaving no way to see
    # why a test failed. A passing run still takes ~9m, so this ceiling only
    # ever costs time on a broken suite.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7

      # One host port per leg: a port binding is not project-scoped the way the
      # Compose project name above is, so parallel legs would otherwise collide
      # on it. Compose publishes this and the e2e suite reads it, so the whole
      # stack follows from the one variable. Shell arithmetic because `+` is
      # not a GitHub expression operator.
      - name: Allocate a host port for this leg
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: echo "WORDPRESS_PORT=$((8888 + JOB_INDEX))" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          # Own no-roles SA (infra PLAT-2550/ISEC-350): this repo is public, so it
          # must not share gha-e2e-tests, which reads every staging/release shop key.
          service_account: gha-woocommerce-plugin-e2e@two-beta.iam.gserviceaccount.com
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER_PREFIX_TWO_BETA }}/${{ github.event.repository.name }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Fetch secrets
        id: secrets
        run: |
          # Temporary: the usual e2e test account has too much order history to
          # place orders reliably; revert to it once that is cleared.
          MERCHANT_API_KEY=$(gcloud secrets versions access latest --secret="STAGING_SHOP_MERCHANT_API_KEY_GB" --project=two-beta)
          echo "::add-mask::$MERCHANT_API_KEY"
          echo "MERCHANT_API_KEY=$MERCHANT_API_KEY" >> $GITHUB_OUTPUT

          TWO_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret="STAGING_TWO_ADMIN_PASSWORD" --project=two-beta)
          echo "::add-mask::$TWO_ADMIN_PASSWORD"
          echo "TWO_ADMIN_PASSWORD=$TWO_ADMIN_PASSWORD" >> $GITHUB_OUTPUT

      - name: Generate Docker plugin config
        run: |
          mkdir -p docker/config
          sed "s|\${MERCHANT_API_KEY}|${MERCHANT_API_KEY}|g" docker/config/staging-demostoregb.json.tpl > docker/config/staging-demostoregb.json
        env:
          MERCHANT_API_KEY: ${{ steps.secrets.outputs.MERCHANT_API_KEY }}

      # The maintained wordpress:php<minor>-apache runtime with this leg's
      # WordPress core swapped in; see the Dockerfile for why not the series tag.
      - name: Build the WordPress ${{ matrix.combo.wordpress }} on PHP ${{ matrix.combo.php }} image
        run: |
          docker build --pull \
            --build-arg PHP_MINOR=${{ matrix.combo.php }} \
            --build-arg WORDPRESS_CORE=${{ matrix.combo.wordpress }} \
            -t "$COMPOSE_PROJECT_NAME-wordpress" docker/wordpress-core

      - name: Start WordPress
        run: |
          # Compose defaults WOOCOM_PLUGIN_CONFIG_JSON to the local-dev
          # config; CI must seed the gateway with the staging config the
          # previous step rendered. WORDPRESS_IMAGE, WPCLI_IMAGE and
          # WOOCOM_VERSION select this leg's combination; wp-cli runs on the
          # leg's PHP minor too, so provisioning exercises it.
          {
            echo "WOOCOM_PLUGIN_CONFIG_JSON=docker/config/staging-demostoregb.json"
            # The seeded config stores staging; the flag is what offers
            # Staging in the admin (TWO-26604).
            echo "TWO_INTERNAL_ENVIRONMENTS=1"
            echo "WORDPRESS_IMAGE=$COMPOSE_PROJECT_NAME-wordpress"
            echo "WPCLI_IMAGE=wordpress:cli-php${{ matrix.combo.php }}"
            echo "WOOCOM_VERSION=${{ matrix.combo.woocommerce }}"
            echo "TWO_DEBUG_LOG_ONLY=1"
            # Company search and lookup are answered by the e2e fake, not Two
            # (TWO-27195): the legs share one merchant key and tripped Two's
            # rate limits on search.
            echo "TWO_E2E_FAKE_COMPANY_SEARCH=1"
          } > .env
          docker compose up -d

      - name: Wait for bootstrap to complete
        run: |
          for i in $(seq 1 60); do
            if docker compose logs wpcli 2>&1 | grep -q "sleep infinity"; then
              echo "Bootstrap complete"
              break
            fi
            echo "Waiting for wpcli bootstrap... ($i/60)"
            sleep 5
          done
          docker compose logs wpcli 2>&1 | grep -q "sleep infinity" || (echo "Bootstrap failed" && docker compose logs && exit 1)

      # A leg that booted something other than its combination would green
      # having tested a version nobody asked for.
      - name: Record the versions under test
        env:
          WANT_WP: ${{ matrix.combo.wordpress }}
          WANT_WC: ${{ matrix.combo.woocommerce }}
          WANT_PHP: ${{ matrix.combo.php }}
        run: |
          set -o pipefail
          wp=$(docker compose exec -T wpcli wp core version | tr -d '\r')
          wc=$(docker compose exec -T wpcli wp plugin get woocommerce --field=version | tr -d '\r')
          php=$(docker compose exec -T wordpress php -r 'echo PHP_VERSION;' | tr -d '\r')
          cli_php=$(docker compose exec -T wpcli php -r 'echo PHP_VERSION;' | tr -d '\r')
          echo "Under test: WordPress $wp, WooCommerce $wc, PHP $php (wp-cli on PHP $cli_php)"
          fail=0
          [ "$wp" = "$WANT_WP" ] || { echo "::error::e2e: expected WordPress $WANT_WP, booted $wp"; fail=1; }
          [ "$wc" = "$WANT_WC" ] || { echo "::error::e2e: expected WooCommerce $WANT_WC, installed $wc"; fail=1; }
          case "$php" in
            "$WANT_PHP".*) ;;
            *) echo "::error::e2e: expected PHP $WANT_PHP, the image runs $php"; fail=1 ;;
          esac
          case "$cli_php" in
            "$WANT_PHP".*) ;;
            *) echo "::error::e2e: expected wp-cli on PHP $WANT_PHP, it runs $cli_php"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ]
          echo "php=$php" >> "$GITHUB_OUTPUT"
          echo "cli_php=$cli_php" >> "$GITHUB_OUTPUT"
        id: versions

      # The image should run the newest patch of its PHP minor (TWO-27171).
      # One behind gets a warning, however long it has lagged; never a failure.
      - name: PHP is the latest patch
        run: |
          bash dev/check-php-patch.sh "wordpress:php${{ matrix.combo.php }}-apache (built with WordPress ${{ matrix.combo.wordpress }})" "${{ steps.versions.outputs.php }}"
          bash dev/check-php-patch.sh "wordpress:cli-php${{ matrix.combo.php }}" "${{ steps.versions.outputs.cli_php }}"

      # The plugin ships a verbatim copy of core's checkout/payment-method.php,
      # replaced through woocommerce_locate_template, an override WooCommerce's
      # own "outdated templates" report cannot see because it scans the active
      # theme only. Every leg has a real WooCommerce release on disk, so diff
      # the copy against it, and run the unit suite on the leg's PHP while at it.
      # env -i: the container carries the shop's settings (TWO_* hosts, internal
      # environments), which the unit suite must not see, as on a bare runner.
      - name: Core template drift (WooCommerce ${{ matrix.combo.woocommerce }})
        run: |
          docker compose exec -T \
            -w /var/www/html/wp-content/plugins/tillit-payment-gateway \
            wordpress env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            WC_CORE_TEMPLATE_PATH=/var/www/html/wp-content/plugins/woocommerce/templates/checkout/payment-method.php \
            php tests/unit/run.php

      - name: Configure the shop for the ${{ matrix.renderer }} checkout
        run: |
          docker compose exec -T wpcli wp eval-file \
            /opt/tillit-payment-gateway/tests/e2e/provision/checkout-renderer.php \
            ${{ matrix.renderer }}

      # The shop logs each call to Two (a transport error or a non-2xx answer
      # as an error) only with API logging on, so a failed leg can show what
      # Two answered the company search (TWO-27184). Set through PHP, not
      # `wp option patch update`, which refuses a key the seeded settings do
      # not carry yet.
      - name: Log the shop's calls to Two
        run: |
          docker compose exec -T wpcli wp eval '
            $key = "woocommerce_woocommerce-gateway-tillit_settings";
            $settings = (array) get_option($key, []);
            $settings["enable_api_logging"] = "yes";
            update_option($key, $settings);
            echo "enable_api_logging: " . get_option($key)["enable_api_logging"] . PHP_EOL;
          '

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: tests/e2e
        # Redacted with the job's REDACT_SED. pipefail keeps a failing run
        # failing the step.
        run: |
          set -o pipefail
          npx playwright test 2>&1 | sed -uE "$REDACT_SED"
        env:
          MERCHANT_API_KEY: ${{ steps.secrets.outputs.MERCHANT_API_KEY }}
          TWO_ADMIN_PASSWORD: ${{ steps.secrets.outputs.TWO_ADMIN_PASSWORD }}
          E2E_CHECKOUT_RENDERER: ${{ matrix.renderer }}

      # Company search and lookup reach the e2e fake and every other call
      # reaches Two (TWO-27195), judged from the shop's own API log: the fake
      # marks each answer with an x-two-e2e-fake header. A leg fails on a
      # search that reached Two or a call the fake answered that is not a
      # search. Paths only, ids collapsed.
      - name: Company searches reached the fake, everything else Two
        if: always() && steps.versions.outcome == 'success'
        run: |
          log=$(docker compose exec -T wordpress sh -c \
            'cat /var/www/html/wp-content/uploads/wc-logs/twoinc-payment-gateway-*.log 2>/dev/null' \
            | tr -d '\r' | grep -F ' CONTEXT: ' || true)
          # shellcheck disable=SC2016
          by='(.response.headers // {}) | if type == "object" then with_entries(.key |= ascii_downcase) else {} end
            | if has("x-two-e2e-fake") then "fake" else "two" end'
          calls=$(while IFS= read -r line; do
            [ -n "$line" ] || continue
            call=$(sed -nE 's/^[^ ]+ [A-Z]+ ([A-Z]+ \/[^ :?]*).*/\1/p' <<<"${line%% CONTEXT: *}")
            [ -n "$call" ] || continue
            echo "$(jq -r "$by" <<<"${line#* CONTEXT: }" 2>/dev/null || echo unreadable) $call"
          done <<<"$log" | perl -pe 's#/(?!v\d+(?:/|$))[^/\s]*\d[^/\s]*#/{id}#g')
          if [ -z "$calls" ]; then
            echo "The shop logged no call to Two."
            exit 0
          fi
          sort <<<"$calls" | uniq -c | sort -rn | sed -E "$REDACT_SED"
          search='GET /companies/v2/company(/[^/ ]+)?$'
          wrong=$( { grep -E "^(two|unreadable) $search" <<<"$calls"; grep -E '^fake ' <<<"$calls" | grep -vE "^fake $search"; } || true)
          if [ -n "$wrong" ]; then
            echo "::error::e2e: a company search reached Two, or the fake answered something else:"
            sort <<<"$wrong" | uniq -c | sed -E "$REDACT_SED"
            exit 1
          fi

      # What the shop logged of its company searches: a transport error or a
      # non-2xx answer is logged as an error (TWO-27184). Search and lookup are
      # answered by the e2e fake (TWO-27195), so an error here is the fake's or
      # the shop's own; the shop's own refusals of a search (a bad checkout
      # token, its rate limiter) are logged as warnings and kept. For each
      # error, the message plus, from its context, the response's status, the
      # headers that name who answered and any rate limit they state, and the
      # body's error code and message fields. Never the request or the whole
      # body. The context is " CONTEXT: " and JSON on every leg: WooCommerce
      # 11 writes it so, and docker/mu-plugins/two-e2e-log-context.php adds it
      # where 7.6 drops it. Everything printed is redacted with REDACT_SED.
      - name: Company searches the shop logged
        if: failure() && steps.versions.outcome == 'success'
        run: |
          log=$(docker compose exec -T wordpress sh -c \
            'cat /var/www/html/wp-content/uploads/wc-logs/twoinc-payment-gateway-*.log 2>/dev/null' \
            | tr -d '\r' \
            | grep -E '/companies/v2/company|^[^ ]+ WARNING .*(company search|company_search|refused)' || true)
          if [ -z "$log" ]; then
            echo "The shop logged no company search."
            exit 0
          fi
          echo "By level: $(awk '{print $2}' <<<"$log" | sort | uniq -c | tr '\n' ' ')"
          errors=$(grep -E '^[^ ]+ (ERROR|CRITICAL|WARNING) ' <<<"$log" || true)
          [ -n "$errors" ] || exit 0
          # shellcheck disable=SC2016
          summary='
            def clip: tostring | gsub("[[:space:]]+"; " ") | .[0:200];
            (.response // {}) as $r
            | ($r.headers | if type == "object" then with_entries(.key |= ascii_downcase) else {} end) as $h
            | $r.body as $b
            | ["status=\($r.status_code // "none")"]
              + [("retry-after", "x-ratelimit-limit", "x-ratelimit-remaining", "x-ratelimit-reset",
                  "server", "via", "cf-ray", "cf-mitigated") as $k
                 | select($h | has($k))
                 | "\($k)=\($h[$k] | if type == "array" then join(",") else . end | clip)"]
              + if ($b | type) == "object" then
                  [("error_code", "error_message", "code", "message", "detail", "error") as $k
                   | select($b[$k] | type == "string" or type == "number")
                   | "body.\($k)=\($b[$k] | clip)"]
                elif ($b | type) == "string" and ($b | length) > 0 then
                  ["body=\(if ($b | test("<html"; "i")) then "html" else "text" end) length=\($b | length)"]
                  + [$b | scan("(?i)error(?: code)?:? ?[0-9]{3,4}") | "body.error=\(clip)"][0:1]
                  + [$b | scan("(?is)<title>(.*?)</title>") | "body.title=\(.[0] | clip)"][0:1]
                else [] end
            | join(" ")'
          out=$(while IFS= read -r line; do
            msg=${line%% CONTEXT: *}
            if [ "$msg" = "$line" ]; then
              details="context not logged"
            else
              details=$(jq -r "$summary" <<<"${line#* CONTEXT: }" 2>/dev/null || echo "context unreadable")
            fi
            echo "$msg | $details"
          done <<<"$errors" | sed -E "$REDACT_SED")
          head -n 50 <<<"$out"
          # Grouped without the values that differ on every response.
          echo "Distinct responses:"
          sed -E 's/^[^|]* \| //; s/(cf-ray|x-ratelimit-remaining|x-ratelimit-reset)=[^ ]*/\1=*/g' <<<"$out" \
            | sort | uniq -c | sort -rn

      # Notices are logged, not printed into the page (TWO_DEBUG_LOG_ONLY in
      # docker-compose.yaml). One from this plugin's code fails the leg, as it
      # did when it broke the page; WooCommerce's or WordPress's own are a
      # warning, since a production shop logs them rather than shows them.
      - name: PHP notices logged by the shop
        if: always() && steps.versions.outcome == 'success'
        run: |
          log=$(docker compose exec -T wordpress sh -c 'cat /var/www/html/wp-content/debug.log 2>/dev/null' | tr -d '\r')
          if [ -z "$log" ]; then
            echo "No PHP notices logged."
            exit 0
          fi
          entries=$(grep -E '^\[[^]]*\] PHP ' <<<"$log" | sed -E 's/^\[[^]]*\] //' || true)
          # Ours: the plugin's directory, or any function, class or asset
          # handle it defines, every one of which carries "twoinc" in some case
          # (or the old name, tillit). A _doing_it_wrong backtrace names
          # functions only, never files, so the path alone misses them.
          # Classified before redaction, so redacting cannot strip the path a
          # notice is classified by. Every line this step prints comes from
          # ours or theirs, so redacting each with the job's REDACT_SED covers
          # them all.
          ours_re='tillit|twoinc'
          tally() { grep . | sed -E "$REDACT_SED" | sort | uniq -c | sort -rn; }
          ours=$(grep -iE "$ours_re" <<<"$entries" | tally || true)
          theirs=$(grep -viE "$ours_re" <<<"$entries" | tally || true)
          if [ -n "$theirs" ]; then
            echo "::warning title=Upstream PHP notices::$(wc -l <<<"$theirs") distinct notices from WordPress or WooCommerce on this combination (see this step's log)"
            echo "$theirs"
          fi
          if [ -n "$ours" ]; then
            head -n 10 <<<"$ours" | while read -r line; do echo "::error title=Plugin PHP notice::$line"; done
            exit 1
          fi
          echo "No PHP notices from this plugin."

      - name: Upload test results
        # always(), not failure(): a job that exceeds timeout-minutes is
        # CANCELLED, not failed, and a cancelled job skips every step whose
        # condition doesn't explicitly reference always()/cancelled() — so
        # failure() silently threw away the results for exactly the runs that
        # needed them most.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per leg: upload-artifact rejects a name already used in the run,
          # so a shared name would fail the second leg on the upload rather
          # than on anything it tested.
          name: playwright-report-wp${{ matrix.combo.wordpress }}-wc${{ matrix.combo.woocommerce }}-php${{ matrix.combo.php }}-${{ matrix.renderer }}
          # Screenshots only: this repo is public and traces, videos and
          # error-context.md can carry cookies and headers.
          path: tests/e2e/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop WordPress
        if: always()
        # -v, not a bare `down`: named volumes survive a bare `down`, so with a
        # per-leg project name they would accumulate on the runner one set per
        # leg, and on a shared runner a bare `down` is what leaves a populated
        # `wordpress_data` behind for some later job to boot on. The leg's
        # image goes too, so legs do not pile images up on a shared runner.
        run: |
          docker compose down -v
          docker image rm -f "$COMPOSE_PROJECT_NAME-wordpress"
