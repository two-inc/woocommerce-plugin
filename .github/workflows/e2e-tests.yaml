name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Which WordPress versions the checkout suite runs on (PLAT-2320), crossed
  # with the checkout renderer the shop is configured for (TWO-25797). The
  # compose default is the floor this suite has always covered; the current
  # release is what the readme's "Tested up to" claims, and nothing exercised
  # a real checkout there. Discovered at run time so the leg tracks upstream
  # instead of going stale as a hand-written pin.
  #
  # Honest-CI convention (TWO-24998): a transport or parse failure FAILS
  # discovery rather than emitting an empty matrix that would skip-green.
  discover:
    name: Discover WordPress versions
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.wp.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the compose default + current WordPress
        id: wp
        run: |
          set -o pipefail
          # Read the floor out of docker-compose.yaml so there is one pin to
          # move, not a second copy here that can drift away from it.
          pinned=$(sed -n 's/^ *image: wordpress:\${WORDPRESS_VERSION:-\([0-9][0-9.]*\)}-php.*/\1/p' docker-compose.yaml)
          if [ -z "$pinned" ]; then
            echo "::error::e2e: could not read the WordPress default from docker-compose.yaml"
            exit 1
          fi
          if ! info=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://api.wordpress.org/core/version-check/1.7/"); then
            echo "::error::e2e: could not query the wordpress.org core version API"
            exit 1
          fi
          # Highest version across the offers, rather than offers[0]: the API
          # orders them by upgrade path, not by version.
          current=$(echo "$info" | jq -r '
            [ .offers[].current
              | select(type == "string" and test("^[0-9]+(\\.[0-9]+)*$")) ]
            | map(split(".") | map(tonumber))
            | sort | last // empty | map(tostring) | join(".")')
          if [ -z "$current" ]; then
            echo "::error::e2e: could not resolve the current WordPress release"
            exit 1
          fi
          # Both renderers on every WordPress leg: which one a shop runs is
          # its checkout page's content, so each is a separately configured
          # shop rather than a switch inside one.
          renderers='"renderer":["classic","blocks"]'
          if [ "$pinned" = "$current" ]; then
            echo "WordPress legs: $current (compose default is already current)"
            echo "matrix={\"wordpress\":[\"$current\"],$renderers}" >> "$GITHUB_OUTPUT"
          else
            echo "WordPress legs: pinned=$pinned current=$current"
            echo "matrix={\"wordpress\":[\"$pinned\",\"$current\"],$renderers}" >> "$GITHUB_OUTPUT"
          fi

  e2e-tests:
    name: e2e (WordPress ${{ matrix.wordpress }}, ${{ matrix.renderer }} checkout)
    needs: discover
    runs-on: ${{ vars.RUNNER_STANDARD }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Namespace the Compose project per leg, the same way support-matrix.yaml
    # and upgrade-smoke.yaml namespace their docker resources by run id. The
    # compose volumes are project-scoped, so a leg landing on a runner that
    # still holds another job's `wordpress_data` would otherwise boot on that
    # install rather than on the WordPress it asked for. This is needed whether
    # or not the legs run in parallel: they need not share a runner, so the
    # teardown below can run somewhere other than where the next leg starts.
    env:
      COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-${{ strategy.job-index }}
    # Must exceed Playwright's own worst case, or a fully-failing suite is
    # killed before it can report: 6 tests x 2 attempts (retries: 1) x the
    # 180s per-test timeout = 36m of testing, plus ~5m of setup. At 15m the
    # job was cancelled mid-run, which discards the reporter output AND the
    # traces, leaving no way to see why a test failed. A passing run still
    # takes ~6m, so this ceiling only ever costs time on a broken suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # One host port per leg: a port binding is not project-scoped the way the
      # Compose project name above is, so parallel legs would otherwise collide
      # on it. Compose publishes this and the e2e suite reads it, so the whole
      # stack follows from the one variable. Shell arithmetic because `+` is
      # not a GitHub expression operator.
      - name: Allocate a host port for this leg
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: echo "WORDPRESS_PORT=$((8888 + JOB_INDEX))" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          service_account: ${{ vars.GCP_E2E_TESTS_SA_NAME_TWO_BETA }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER_PREFIX_TWO_BETA }}/${{ github.event.repository.name }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Fetch secrets
        id: secrets
        run: |
          # Temporary: the usual e2e test account has too much order history to
          # place orders reliably; revert to it once that is cleared.
          MERCHANT_API_KEY=$(gcloud secrets versions access latest --secret="STAGING_SHOP_MERCHANT_API_KEY_GB" --project=two-beta)
          echo "::add-mask::$MERCHANT_API_KEY"
          echo "MERCHANT_API_KEY=$MERCHANT_API_KEY" >> $GITHUB_OUTPUT

          TWO_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret="STAGING_TWO_ADMIN_PASSWORD" --project=two-beta)
          echo "::add-mask::$TWO_ADMIN_PASSWORD"
          echo "TWO_ADMIN_PASSWORD=$TWO_ADMIN_PASSWORD" >> $GITHUB_OUTPUT

      - name: Generate Docker plugin config
        run: |
          mkdir -p docker/config
          sed "s|\${MERCHANT_API_KEY}|${MERCHANT_API_KEY}|g" docker/config/staging-demostoregb.json.tpl > docker/config/staging-demostoregb.json
        env:
          MERCHANT_API_KEY: ${{ steps.secrets.outputs.MERCHANT_API_KEY }}

      - name: Start WordPress
        run: |
          # Compose defaults WOOCOM_PLUGIN_CONFIG_JSON to the local-dev
          # config; CI must seed the gateway with the staging config the
          # previous step rendered. WORDPRESS_VERSION selects this leg's
          # image tag; WooCommerce stays at the compose pin in both legs, so
          # WordPress is the only variable that moves between them.
          {
            echo "WOOCOM_PLUGIN_CONFIG_JSON=docker/config/staging-demostoregb.json"
            echo "WORDPRESS_VERSION=${{ matrix.wordpress }}"
          } > .env
          docker compose up -d

      - name: Wait for bootstrap to complete
        run: |
          for i in $(seq 1 60); do
            if docker compose logs wpcli 2>&1 | grep -q "sleep infinity"; then
              echo "Bootstrap complete"
              break
            fi
            echo "Waiting for wpcli bootstrap... ($i/60)"
            sleep 5
          done
          docker compose logs wpcli 2>&1 | grep -q "sleep infinity" || (echo "Bootstrap failed" && docker compose logs && exit 1)

      - name: Record the WordPress version under test
        run: |
          set -o pipefail
          booted=$(docker compose exec -T wpcli wp core version | tr -d '\r')
          echo "WordPress under test: $booted (leg: ${{ matrix.wordpress }})"
          # A mistyped or withdrawn tag leaves the image resolving to something
          # else, which would green having tested a version nobody asked for.
          case "$booted" in
            "${{ matrix.wordpress }}" | "${{ matrix.wordpress }}".*) ;;
            *)
              echo "::error::e2e: expected WordPress ${{ matrix.wordpress }}, booted $booted"
              exit 1
              ;;
          esac

      - name: Configure the shop for the ${{ matrix.renderer }} checkout
        run: |
          docker compose exec -T wpcli wp eval-file \
            /opt/tillit-payment-gateway/tests/e2e/provision/checkout-renderer.php \
            ${{ matrix.renderer }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          MERCHANT_API_KEY: ${{ steps.secrets.outputs.MERCHANT_API_KEY }}
          TWO_ADMIN_PASSWORD: ${{ steps.secrets.outputs.TWO_ADMIN_PASSWORD }}
          E2E_CHECKOUT_RENDERER: ${{ matrix.renderer }}

      - name: Upload test results
        # always(), not failure(): a job that exceeds timeout-minutes is
        # CANCELLED, not failed, and a cancelled job skips every step whose
        # condition doesn't explicitly reference always()/cancelled() — so
        # failure() silently threw away the traces for exactly the runs that
        # needed them most.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per leg: upload-artifact rejects a name already used in the run,
          # so a shared name would fail the second leg on the upload rather
          # than on anything it tested.
          name: playwright-report-wp${{ matrix.wordpress }}-${{ matrix.renderer }}
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop WordPress
        if: always()
        # -v, not a bare `down`: named volumes survive a bare `down`, so with a
        # per-leg project name they would accumulate on the runner one set per
        # leg, and on a shared runner a bare `down` is what leaves a populated
        # `wordpress_data` behind for some later job to boot on.
        run: docker compose down -v
